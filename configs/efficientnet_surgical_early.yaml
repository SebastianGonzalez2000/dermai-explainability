model_id: google/efficientnet-b0
data_dir: data
output_dir: outputs
batch_size: 32
num_workers: 0
weight_decay: 0.01
warmup_ratio: 0.1
seed: 42
device: auto
run_name_suffix: -surgical-early

phases:
  - {name: head, epochs: 5, lr: 1.0e-3, unfreeze_backbone: false}
  - {name: early, epochs: 15, lr: 1.0e-4, unfreeze_backbone: true, block_span: early}
